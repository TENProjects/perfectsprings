# Install in /etc/nginx/sites-available/perfectsprings.
# sites-enabled must be included from nginx.conf's http block.
limit_req_zone $binary_remote_addr zone=perfectsprings_api:10m rate=10r/m;

server {
    listen 80;
    server_name perfectspringsllc.com;
    root /var/www/perfectsprings/public;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/xml;

    location /api/ {
        limit_req zone=perfectsprings_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }
    location ~ /\. { deny all; }
    location ~ \.mjs$ { default_type text/javascript; try_files $uri =404; }
    location ~* \.(webp|ico)$ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
